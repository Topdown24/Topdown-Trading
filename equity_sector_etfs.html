// ============================================================
//  SEEDED RNG
// ============================================================
function mkRng(seed) {
  let s = (seed ^ 0xdeadbeef) >>> 0;
  return () => {
    s = Math.imul(s ^ (s >>> 16), 0x45d9f3b) >>> 0;
    s = Math.imul(s ^ (s >>> 16), 0x45d9f3b) >>> 0;
    return s / 4294967296;
  };
}
function strHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = (((h << 5) + h) ^ str.charCodeAt(i)) >>> 0;
  return h;
}
function genIR(sym, salt) {
  const r = mkRng(strHash(sym + (salt || '')));
  r(); r(); // warm up
  const v = (r() + r() + r() + r()) / 4; // average → more central distribution
  return Math.max(-99, Math.min(99, Math.round((v * 2 - 1) * 88)));
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  const r3a = mkRng(strHash(sym + '3mo90')); r3a(); r3a();
  const r3b = mkRng(strHash(sym + '3mo10')); r3b(); r3b();
  DATA[sym] = {
    sym, name: NAMES[sym],
    ir_90: ir90, ir_10: ir10,
    ir_90_3mo: clamp(Math.round(-ir90 * 0.65 + (r3a() - 0.5) * 46), -99, 99),
    ir_10_3mo: clamp(Math.round(-ir10 * 0.65 + (r3b() - 0.5) * 46), -99, 99),
  };
});

const ZCL = ['#00cc55','#88cc44','#7a9aaa','#aa9a7a','#ddcc00','#e83535'];

function irToZone(ir) {
  if (ir >= 67) return 1; if (ir >= 34) return 2; if (ir >= 1) return 3;
  if (ir >= -33) return 4; if (ir >= -66) return 5; return 6;
}
function zoneBadge(z) {
  return `<span class="zone-badge" style="background:${ZCL[z-1]}">${z}</span>`;
}
function irFmt(v) { return (v > 0 ? '+' : '') + v; }
function irCls(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'zer'; }

// Returns [zone_idx(0-5), slot_idx(0-3)]
function zoneSlot(ir) {
  if (ir >= 91) return [0,0]; if (ir >= 83) return [0,1];
  if (ir >= 75) return [0,2]; if (ir >= 67) return [0,3];
  if (ir >= 59) return [1,0]; if (ir >= 52) return [1,1];
  if (ir >= 43) return [1,2]; if (ir >= 34) return [1,3];
  if (ir >= 26) return [2,0]; if (ir >= 18) return [2,1];
  if (ir >= 9)  return [2,2]; if (ir >= 1)  return [2,3];
  if (ir >= -8)  return [3,0]; if (ir >= -17) return [3,1];
  if (ir >= -25) return [3,2]; if (ir >= -33) return [3,3];
  if (ir >= -42) return [4,0]; if (ir >= -51) return [4,1];
  if (ir >= -58) return [4,2]; if (ir >= -66) return [4,3];
  if (ir >= -74) return [5,0]; if (ir >= -82) return [5,1];
  if (ir >= -90) return [5,2]; return [5,3];
}

// ============================================================
//  HISTOGRAM BUILDER
// ============================================================
function buildHistogram() {
  const W = 920, OW = 28, BX = 28, BW = 864, ZW = 144;
  const SLOT_PITCH = BW / 24;
  let BY = 205;
  const SH = 13, SFS = 9;
  const BCX = 460, BELL_A = 168, BELL_FLOOR = 16, BELL_SIG = ZW;

  // Build slots[6][4]
  const slots = Array.from({length:6}, () => Array.from({length:4}, () => []));
  const oobL = [], oobR = [];

  ALL_SYMS.forEach(sym => {
    const ir = DATA[sym].ir_90;
    if (ir > 99)  { oobL.push(sym); return; }
    if (ir < -99) { oobR.push(sym); return; }
    const [z, s] = zoneSlot(ir);
    slots[z][s].push(sym);
  });

  // Sort alphabetically within each slot
  slots.forEach(zone => zone.forEach(sl => sl.sort()));

  // Dynamic height
  const maxStk = Math.max(1, ...slots.flat().map(s => s.length));
  if (maxStk * SH + 20 > BY) BY = maxStk * SH + 20;
  const H = BY + 63;
  const LY_RANGE = BY + 18, LY_ZONE = BY + 31, LY_LEG = H - 5;

  const svgEl = document.getElementById('mainHisto');
  svgEl.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const Z_LABELS = ['Zone 1','Zone 2','Zone 3','Zone 4','Zone 5','Zone 6'];
  const Z_RANGES = ['+99 to +67','+66 to +34','+33 to +1','−1 to −33','−34 to −66','−67 to −99'];

  let s = '';

  // Defs
  s += `<defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow"><feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  // OOB backgrounds
  s += `<rect x="0" y="0" width="${OW}" height="${H}" fill="rgba(0,204,85,0.06)"/>`;
  s += `<rect x="${W-OW}" y="0" width="${OW}" height="${H}" fill="rgba(232,53,53,0.06)"/>`;

  // Zone backgrounds
  for (let z = 0; z < 6; z++) {
    s += `<rect x="${BX+z*ZW}" y="0" width="${ZW}" height="${BY}" fill="${ZCL[z]}" fill-opacity="0.07"/>`;
  }

  // Zone dividers (inner)
  for (let z = 1; z < 6; z++) {
    const x = BX + z * ZW;
    s += `<line x1="${x}" y1="0" x2="${x}" y2="${BY}" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>`;
  }
  // OOB dividers
  s += `<line x1="${BX}" y1="0" x2="${BX}" y2="${BY}" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>`;
  s += `<line x1="${BX+BW}" y1="0" x2="${BX+BW}" y2="${BY}" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>`;

  // Slot dividers (23 dashed lines)
  for (let i = 1; i < 24; i++) {
    const x = BX + i * SLOT_PITCH;
    s += `<line x1="${x}" y1="8" x2="${x}" y2="${BY}" stroke="rgba(255,255,255,0.055)" stroke-width="0.5" stroke-dasharray="3,6"/>`;
  }

  // Baseline
  s += `<line x1="0" y1="${BY}" x2="${W}" y2="${BY}" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>`;

  // Bell curve
  function bellY(px) {
    const dx = px - BCX;
    return BY - (BELL_A * Math.exp(-dx * dx / (2 * BELL_SIG * BELL_SIG)) + BELL_FLOOR);
  }
  let bp = `M ${BX} ${bellY(BX).toFixed(2)}`;
  for (let px = BX + 2; px <= BX + BW; px += 2) bp += ` L ${px} ${bellY(px).toFixed(2)}`;
  s += `<path d="${bp}" fill="none" stroke="rgba(120,185,255,0.14)" stroke-width="8"/>`;
  s += `<path d="${bp}" fill="none" stroke="rgba(155,210,255,0.72)" stroke-width="1.6" stroke-dasharray="8,4" filter="url(#glow)"/>`;
  s += `<path d="${bp}" fill="none" stroke="rgba(205,235,255,0.38)" stroke-width="0.8" stroke-dasharray="8,4"/>`;

  // Symbols — stacked upward from baseline, sorted alphabetically (A at top = smallest y)
  for (let z = 0; z < 6; z++) {
    for (let sl = 0; sl < 4; sl++) {
      const i = z * 4 + sl;
      const scx = BX + (i + 0.5) * SLOT_PITCH;
      const syms = slots[z][sl];
      const len = syms.length;
      syms.forEach((sym, k) => {
        // k=0 → top (smallest y); k=len-1 → bottom (largest y, near baseline)
        const sy = BY - (len - k) * SH + SH * 0.7;
        const d = DATA[sym];
        const tip = `${sym} — ${d.name}  |  90-IR: ${irFmt(d.ir_90)}  |  Zone ${irToZone(d.ir_90)}`;
        const label = sym.slice(0, 3);
        s += `<text x="${scx.toFixed(1)}" y="${sy.toFixed(1)}" text-anchor="middle" font-family="'Courier New',monospace" font-size="${SFS}" font-weight="bold" fill="${ZCL[z]}" filter="url(#softglow)" cursor="pointer" data-tip="${tip}">${label}</text>`;
      });
    }
  }

  // OOB labels
  const oStyle = `font-family="'Courier New',monospace" font-size="7" text-anchor="middle"`;
  s += `<text x="${OW/2}" y="16" ${oStyle} fill="#00cc55">OOB</text>`;
  s += `<text x="${OW/2}" y="27" ${oStyle} fill="#00cc55">Weak</text>`;
  s += `<text x="${OW/2}" y="38" ${oStyle} fill="#00cc55">[${oobL.length}]</text>`;
  s += `<text x="${OW/2}" y="49" ${oStyle} fill="rgba(0,204,85,0.55)">≥+99</text>`;
  s += `<text x="${W-OW/2}" y="16" ${oStyle} fill="#e83535">OOB</text>`;
  s += `<text x="${W-OW/2}" y="27" ${oStyle} fill="#e83535">Str</text>`;
  s += `<text x="${W-OW/2}" y="38" ${oStyle} fill="#e83535">[${oobR.length}]</text>`;
  s += `<text x="${W-OW/2}" y="49" ${oStyle} fill="rgba(232,53,53,0.55)">≤−99</text>`;

  // Zone range + bold labels
  for (let z = 0; z < 6; z++) {
    const cx = BX + z * ZW + ZW / 2;
    s += `<text x="${cx}" y="${LY_RANGE}" text-anchor="middle" font-family="'Courier New',monospace" font-size="8.5" fill="rgba(255,255,255,0.48)">${Z_RANGES[z]}</text>`;
    s += `<text x="${cx}" y="${LY_ZONE}" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="10.5" font-weight="bold" fill="${ZCL[z]}">${Z_LABELS[z]}</text>`;
  }

  // Direction legend
  s += `<text x="${BX}" y="${LY_LEG}" font-family="'Trebuchet MS',sans-serif" font-size="7.5" fill="rgba(0,212,160,0.40)">← Weak / Oversold</text>`;
  s += `<text x="${BX+BW}" y="${LY_LEG}" text-anchor="end" font-family="'Trebuchet MS',sans-serif" font-size="7.5" fill="rgba(232,53,53,0.40)">Overbought / Strong →</text>`;

  svgEl.innerHTML = s;

  // Tooltip
  const tip = document.getElementById('histo-tip');
  svgEl.addEventListener('mousemove', e => {
    const el = e.target;
    if (el.dataset && el.dataset.tip) {
      tip.textContent = el.dataset.tip;
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top  = (e.clientY - 10) + 'px';
    } else {
      tip.style.display = 'none';
    }
  });
  svgEl.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}

// ============================================================
//  LH TOGGLE
// ============================================================
const lhState = { period: '90', dir: 1 };

function renderLH() {
  const irF = lhState.period === '90' ? 'ir_90' : 'ir_10';
  const sorted = [...ALL_SYMS.map(s => DATA[s])].sort((a, b) => (b[irF] - a[irF]) * lhState.dir);
  document.getElementById('lh-arr').textContent = lhState.dir === 1 ? '↓' : '↑';
  document.getElementById('lh-tbody').innerHTML = sorted.map(r => {
    const ir = r[irF];
    const z  = irToZone(ir);
    const nm = r.name.length > 22 ? r.name.slice(0, 22) + '…' : r.name;
    return `<tr>
      <td class="col-sym">${r.sym}</td>
      <td style="color:#5a7a9a;font-size:10px">${nm}</td>
      <td class="col-ir"><span class="${irCls(ir)}">${irFmt(ir)}</span></td>
      <td class="col-zone">${zoneBadge(z)}</td>
    </tr>`;
  }).join('');
}

function handleSortLH() {
  lhState.dir *= -1;
  renderLH();
}

// ============================================================
//  REGULAR TOGGLE (sub-groups)
// ============================================================
const pState  = {};   // { gid: '90'|'10' }
const sState  = {};   // { gid: { field:'ir'|'3mo', dir:1|-1 } }

function buildToggleWidget(gid, l1, l2) {
  return `<div class="grp-block">
    <div class="grp-title">
      <div class="grp-title-l1">${l1}</div>
      <div class="grp-title-l2">${l2}</div>
    </div>
    <div class="toggle-wrap">
      <div class="toggle-hdr">
        <button class="toggle-btn active" data-gid="${gid}" data-period="90" onclick="handlePeriod(this)">90 IR</button>
        <button class="toggle-btn"        data-gid="${gid}" data-period="10" onclick="handlePeriod(this)">10 IR</button>
      </div>
      <div class="scroll-table">
        <table class="ir-table">
          <thead><tr>
            <th>Ticker</th>
            <th>Name</th>
            <th class="sortable sort-active" id="${gid}-th-ir"  onclick="handleSort2('${gid}','ir')"  style="text-align:center">IR <span class="sort-arrow active" id="${gid}-arr-ir">↓</span></th>
            <th style="text-align:center">Zn</th>
            <th class="sortable" id="${gid}-th-3mo" onclick="handleSort2('${gid}','3mo')" style="text-align:center;padding-left:14px">3Mo Ago <span class="sort-arrow" id="${gid}-arr-3mo">↕</span></th>
          </tr></thead>
          <tbody id="${gid}-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function renderToggle(gid) {
  const p  = pState[gid] || '90';
  const { field, dir } = sState[gid] || { field: 'ir', dir: 1 };
  const irF = p === '90' ? 'ir_90'     : 'ir_10';
  const moF = p === '90' ? 'ir_90_3mo' : 'ir_10_3mo';
  const sF  = field === 'ir' ? irF : moF;

  const rows = [...GRPS[gid].map(s => DATA[s])].sort((a, b) => (b[sF] - a[sF]) * dir);

  document.getElementById(gid + '-tbody').innerHTML = rows.map(r => {
    const ir = r[irF], mo = r[moF], z = irToZone(ir);
    const nm = r.name.length > 22 ? r.name.slice(0, 22) + '…' : r.name;
    return `<tr>
      <td class="col-sym">${r.sym}</td>
      <td style="color:#5a7a9a;font-size:10px">${nm}</td>
      <td class="col-ir"><span class="${irCls(ir)}">${irFmt(ir)}</span></td>
      <td class="col-zone">${zoneBadge(z)}</td>
      <td class="col-3mo" style="padding-left:14px"><span class="${irCls(mo)}">${irFmt(mo)}</span></td>
    </tr>`;
  }).join('');

  // Update sort arrows
  ['ir', '3mo'].forEach(f => {
    const th  = document.getElementById(`${gid}-th-${f}`);
    const arr = document.getElementById(`${gid}-arr-${f}`);
    if (!th || !arr) return;
    const on = f === field;
    if (on) { th.classList.add('sort-active');    arr.classList.add('active');    arr.textContent = dir === 1 ? '↓' : '↑'; }
    else    { th.classList.remove('sort-active'); arr.classList.remove('active'); arr.textContent = '↕'; }
  });
}

// ============================================================
//  EVENT HANDLERS
// ============================================================
function handlePeriod(btn) {
  const gid    = btn.dataset.gid;
  const period = btn.dataset.period;
  // Deactivate siblings
  const container = gid === 'lh'
    ? btn.closest('.period-btns')
    : btn.closest('.toggle-hdr');
  container.querySelectorAll('.period-btn, .toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (gid === 'lh') { lhState.period = period; renderLH(); }
  else              { pState[gid] = period; renderToggle(gid); }
}

function handleSort2(gid, field) {
  const st = sState[gid] || { field: 'ir', dir: 1 };
  sState[gid] = st.field === field
    ? { field, dir: st.dir * -1 }
    : { field, dir: 1 };
  renderToggle(gid);
}

// ============================================================
//  INIT
// ============================================================
(function init() {
  // Inject toggle pair rows
  const container = document.getElementById('toggle-pairs');
  PAIR_DEFS.forEach(pair => {
    const row = document.createElement('div');
    row.className = 'two-col';
    row.innerHTML = pair.map(({ gid, l1, l2 }) => buildToggleWidget(gid, l1, l2)).join('');
    container.appendChild(row);
  });

  // Init state for all sub-group toggles
  Object.keys(GRPS).forEach(gid => {
    pState[gid] = '90';
    sState[gid] = { field: 'ir', dir: 1 };
  });

  // Render everything
  buildHistogram();
  renderLH();
  Object.keys(GRPS).forEach(gid => renderToggle(gid));
})();
</script>
