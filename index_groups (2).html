<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF and Index Groups — Top Down Trading</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#08111e;--panel:#0d1829;--panel-alt:#0a1420;
  --border:#1a2d44;--border-lite:#243c58;
  --text:#ddeeff;--dim:#5a7a9a;--accent:#3090d8;--gold:#c9a227;
  --z1:#00cc55;--z2:#88cc44;--z3:#7a9aaa;--z4:#aa9a7a;--z5:#ddcc00;--z6:#e83535;
}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow:hidden;}

/* ── HEADER BLOCK (both lines sticky together) ── */
.header-block{position:sticky;top:0;z-index:100;flex-shrink:0;}

/* Line 1 — Nav controls: BACK · · · SEARCH */
.top-nav{
  height:44px;background:var(--panel-alt);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:10px;
}
.nav-back{
  background:var(--panel);border:1px solid var(--border-lite);color:var(--dim);
  font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:5px 14px;
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.nav-back:hover{border-color:var(--accent);color:var(--text);}
.nav-spacer{flex:1;}
.search-box{
  background:var(--panel);border:1px solid var(--border-lite);color:var(--text);
  font-family:'Rajdhani',sans-serif;font-size:12px;padding:5px 10px;
  outline:none;width:160px;transition:border-color .15s;
}
.search-box::placeholder{color:var(--dim);}
.search-box:focus{border-color:var(--accent);}

/* Line 2 — Page title */
.page-title-bar{
  height:32px;background:var(--panel);border-bottom:2px solid var(--border-lite);
  display:flex;align-items:center;justify-content:center;
}
.page-title-text{
  font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;
  color:var(--text);letter-spacing:.06em;text-transform:uppercase;
}

/* ── SHELL — height accounts for both header lines (44 + 32 = 76px) ── */
.shell{display:flex;height:calc(100vh - 76px);overflow:hidden;}

/* ── LEFT SIDEBAR ── */
.sidebar{
  width:285px;min-width:285px;border-right:2px solid var(--border-lite);
  display:flex;flex-direction:column;background:var(--panel-alt);
  flex-shrink:0;overflow:hidden;
}
.sb-head{padding:8px 10px 6px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sb-title{text-align:center;font-weight:700;font-size:12px;color:var(--text);margin-bottom:5px;}
.period-btns{display:flex;justify-content:center;gap:4px;}
.p-btn{
  background:#1a2d44;border:1px solid #1a2d44;color:var(--dim);
  font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;
  padding:3px 10px;cursor:pointer;transition:all .15s;
}
.p-btn.active{background:#2a7abf;border-color:#3090d8;color:#fff;}
.p-btn:hover:not(.active){border-color:#3090d8;color:var(--text);}
.sb-scroll{overflow-y:auto;flex:1;}
.sb-scroll::-webkit-scrollbar{width:4px;}
.sb-scroll::-webkit-scrollbar-track{background:#08111e;}
.sb-scroll::-webkit-scrollbar-thumb{background:#243c58;border-radius:2px;}
.lh-table{width:100%;border-collapse:collapse;font-family:'Courier New',monospace;font-size:11px;}
.lh-table th{
  background:var(--panel-alt);color:var(--dim);padding:4px 6px;
  border-bottom:1px solid var(--border);position:sticky;top:0;
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
}
.lh-table th.lh-sort-active{color:var(--accent);}
.lh-table td{padding:3px 6px;border-bottom:1px solid #0e1a28;white-space:nowrap;}
.lh-table tr:hover td{background:#111e30;}

/* ── RIGHT CONTENT ── */
.right-content{flex:1;overflow-y:auto;padding:10px 14px;}
.right-content::-webkit-scrollbar{width:6px;}
.right-content::-webkit-scrollbar-track{background:#08111e;}
.right-content::-webkit-scrollbar-thumb{background:#243c58;border-radius:3px;}

/* ── HISTOGRAM ── */
.histo-wrap{margin-bottom:14px;}
.hist-title{
  font-weight:700;font-size:13px;color:var(--text);
  text-align:center;margin-bottom:6px;letter-spacing:.03em;
}
.histo-svg-box{background:var(--panel);border:1px solid var(--border);overflow:hidden;}
#histo-tip{
  position:fixed;background:#0d1829;border:1px solid #3090d8;color:#ddeeff;
  font-family:'Courier New',monospace;font-size:11px;padding:5px 9px;
  border-radius:2px;box-shadow:0 2px 12px rgba(0,0,0,.6);
  white-space:nowrap;z-index:999;pointer-events:none;display:none;
}

/* ── SECTION HEADING ── */
.section-heading{
  font-size:14px;font-weight:700;color:var(--gold);text-align:center;
  letter-spacing:.05em;text-transform:uppercase;
  margin:18px 0 12px;border-top:1px solid var(--border-lite);padding-top:14px;
}

/* ── REGULAR TOGGLES ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.toggle-wrap{background:var(--panel);border:1px solid var(--border);overflow:hidden;}
.toggle-header{
  background:var(--panel-alt);border-bottom:1px solid var(--border);
  padding:6px 10px;display:flex;align-items:flex-start;justify-content:space-between;
}
.toggle-title-block{display:flex;flex-direction:column;padding-right:8px;min-width:0;}
.toggle-title{font-weight:700;font-size:12px;color:var(--text);}
.toggle-subtitle{font-style:italic;font-size:10px;color:var(--dim);margin-top:2px;}
.toggle-btns{display:flex;gap:2px;flex-shrink:0;align-self:center;}
.t-btn{
  background:#1a2d44;border:1px solid #1a2d44;color:var(--dim);
  font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:600;
  padding:3px 10px;cursor:pointer;transition:all .15s;
}
.t-btn.active{background:#2a7abf;border-color:#3090d8;color:#fff;}
.t-btn:hover:not(.active){border-color:#3090d8;color:var(--text);}
.scroll-table{max-height:340px;overflow-y:auto;}
.scroll-table::-webkit-scrollbar{width:4px;}
.scroll-table::-webkit-scrollbar-track{background:#08111e;}
.scroll-table::-webkit-scrollbar-thumb{background:#243c58;border-radius:2px;}
.ir-table{width:100%;border-collapse:collapse;font-family:'Courier New',monospace;font-size:11px;}
.ir-table th{
  background:var(--panel);color:var(--dim);padding:4px 6px;text-align:left;
  border-bottom:1px solid var(--border);position:sticky;top:0;
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
}
.ir-table th.sortable{cursor:pointer;user-select:none;}
.ir-table th.sortable:hover{color:var(--text);}
.ir-table th.sort-active{color:var(--accent);}
.sort-arrow{font-size:10px;margin-left:3px;opacity:.5;}
.sort-arrow.active{opacity:1;color:var(--accent);}
.ir-table td{padding:3px 6px;border-bottom:1px solid #0e1a28;white-space:nowrap;}
.ir-table tr:hover td{background:#111e30;}
.col-sym{color:var(--text);font-weight:bold;}
.col-ir,.col-zone,.col-3mo{text-align:center;}
.col-3mo{font-size:10px;}
.zone-badge{display:inline-block;padding:1px 5px;font-size:10px;font-weight:bold;border-radius:2px;color:#000;}
.pos{color:#88cc44;}.neg{color:#e83535;}.zer{color:#b8cce0;}
</style>

<div class="header-block">

  </div>

<div id="histo-tip"></div>

          </th>
          <th style="text-align:center">Zn</th>
        </tr></thead>
        <tbody id="sb-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- ── RIGHT CONTENT ── -->
  <div class="right-content">
    <div class="histo-wrap">
      <div class="hist-title">ETF and Index Groups — 90-Day Implied Risk Histogram</div>
      <div class="histo-svg-box">

      </div>
    </div>

    <div class="section-heading">Sector Analysis Using ETF and Index Groups</div>

    <div id="toggles-container"></div>
  </div>
</div>

const sortState={},periodState={};

function handlePeriodToggle(btn){
  const g=btn.dataset.group;
  btn.closest('.toggle-btns').querySelectorAll('.t-btn')
     .forEach(b=>b.classList.toggle('active',b===btn));
  periodState[g]=btn.dataset.period;
  renderToggle(g);
}
function handleSortClick(g,field){
  if(!sortState[g])sortState[g]={field:'ir',dir:1};
  const s=sortState[g];
  sortState[g]=s.field===field?{field,dir:s.dir*-1}:{field,dir:1};
  renderToggle(g);
}
function updateArrows(g){
  const{field,dir}=sortState[g];
  ['ir','3mo'].forEach(f=>{
    const th=document.getElementById(`${g}-th-${f}`);
    const ar=document.getElementById(`${g}-arr-${f}`);
    if(!th||!ar)return;
    const on=f===field;
    if(on){th.classList.add('sort-active');ar.classList.add('active');ar.textContent=dir===1?'↓':'↑';}
    else  {th.classList.remove('sort-active');ar.classList.remove('active');ar.textContent='↕';}
  });
}
function renderToggle(g){
  if(!sortState[g])sortState[g]={field:'ir',dir:1};
  if(!periodState[g])periodState[g]='90';
  const p=periodState[g];
  const iF=p==='90'?'ir_90':'ir_10';
  const mF=p==='90'?'ir_90_3mo':'ir_10_3mo';
  const{field,dir}=sortState[g];
  const sF=field==='ir'?iF:mF;
  const grp=TOGGLE_GROUPS.find(t=>t.id===g);
  const rows=[...grp.symbols.map(s=>DATA_MAP[s]).filter(Boolean)]
    .sort((a,b)=>(b[sF]-a[sF])*dir);
  document.getElementById(g+'-tbody').innerHTML=rows.map(r=>{
    const ir=r[iF],mo=r[mF],z=irToZone(ir),nm=trunc(r.name,22);
    return `<tr>
      <td class="col-sym">${r.symbol}</td>
      <td style="color:var(--dim);font-size:10px">${nm}</td>
      <td class="col-ir"><span class="${irCls(ir)}">${irFmt(ir)}</span></td>
      <td class="col-zone">${zoneBadge(z)}</td>
      <td class="col-3mo" style="padding-left:14px"><span class="${irCls(mo)}">${irFmt(mo)}</span></td>
    </tr>`;
  }).join('');
  updateArrows(g);
}

function getSlotInfo(ir){
  if(ir>=91)return{z:0,s:0};if(ir>=83)return{z:0,s:1};
  if(ir>=75)return{z:0,s:2};if(ir>=67)return{z:0,s:3};
  if(ir>=59)return{z:1,s:0};if(ir>=52)return{z:1,s:1};
  if(ir>=43)return{z:1,s:2};if(ir>=34)return{z:1,s:3};
  if(ir>=26)return{z:2,s:0};if(ir>=18)return{z:2,s:1};
  if(ir>= 9)return{z:2,s:2};if(ir>= 1)return{z:2,s:3};
  if(ir>=-8) return{z:3,s:0};if(ir>=-17)return{z:3,s:1};
  if(ir>=-25)return{z:3,s:2};if(ir>=-33)return{z:3,s:3};
  if(ir>=-42)return{z:4,s:0};if(ir>=-51)return{z:4,s:1};
  if(ir>=-58)return{z:4,s:2};if(ir>=-66)return{z:4,s:3};
  if(ir>=-74)return{z:5,s:0};if(ir>=-82)return{z:5,s:1};
  if(ir>=-90)return{z:5,s:2};return{z:5,s:3};
}

function buildHistogram(){
  const svg=document.getElementById('mainHisto');
  const W=920,OW=28,BX=OW,BW=864;
  const ZW=144,SLOT_PITCH=BW/24;
  const SH=13,SFS=9;
  const BELL_A=168,BELL_FLOOR=16,BELL_SIG=ZW,BCX=BX+BW/2;

  // Build slots
  const slots=Array.from({length:24},()=>[]);
  const oobWeak=[],oobStr=[];
  ALL_DATA.forEach(d=>{
    const ir=d.ir_90;
    if(ir>=99){oobWeak.push(d.symbol);}
    else if(ir<=-99){oobStr.push(d.symbol);}
    else{const{z,s}=getSlotInfo(ir);slots[z*4+s].push(d);}
  });
  slots.forEach(sl=>sl.sort((a,b)=>a.symbol.localeCompare(b.symbol)));

  // Dynamic height
  let BY=205;
  const maxStk=Math.max(1,...slots.map(sl=>sl.length));
  if(maxStk*SH+20>BY)BY=maxStk*SH+20;
  const H=BY+63;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const LY_RANGE=BY+18,LY_ZONE=BY+31;
  const ZN=['Zone 1','Zone 2','Zone 3','Zone 4','Zone 5','Zone 6'];
  const ZR=['+99 to +67','+66 to +34','+33 to +1','-1 to -33','-34 to -66','-67 to -99'];

  let s='';
  // defs
  s+=`<defs>
    <filter id="glow"><feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow"><feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  // OOB backgrounds
  s+=`<rect x="0" y="0" width="${OW}" height="${BY}" fill="${ZCL[0]}" fill-opacity="0.12"/>`;
  s+=`<rect x="${BX+BW}" y="0" width="${OW}" height="${BY}" fill="${ZCL[5]}" fill-opacity="0.12"/>`;

  // Zone backgrounds
  for(let zi=0;zi<6;zi++){
    const zx=BX+zi*ZW;
    s+=`<rect x="${zx}" y="0" width="${ZW}" height="${BY}" fill="${ZCL[zi]}" fill-opacity="0.07"/>`;
  }

  // Zone dividers
  for(let zi=1;zi<6;zi++){
    const dx=BX+zi*ZW;
    s+=`<line x1="${dx}" y1="0" x2="${dx}" y2="${BY}" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>`;
  }
  s+=`<line x1="${BX}" y1="0" x2="${BX}" y2="${BY}" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>`;
  s+=`<line x1="${BX+BW}" y1="0" x2="${BX+BW}" y2="${BY}" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>`;

  // Slot dividers (23 dashed lines)
  for(let i=1;i<24;i++){
    const dx=BX+i*SLOT_PITCH;
    s+=`<line x1="${dx}" y1="8" x2="${dx}" y2="${BY}" stroke="rgba(255,255,255,0.055)" stroke-width="0.5" stroke-dasharray="3,6"/>`;
  }

  // Baseline
  s+=`<line x1="0" y1="${BY}" x2="${W}" y2="${BY}" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>`;

  // Bell curve — 3 passes
  function bellPts(){
    const pts=[];
    for(let px=BX;px<=BX+BW;px+=2){
      const dx=px-BCX;
      const yp=BY-(BELL_A*Math.exp(-dx*dx/(2*BELL_SIG*BELL_SIG))+BELL_FLOOR);
      pts.push(`${px},${yp.toFixed(1)}`);
    }
    return pts.join(' ');
  }
  const bPts=bellPts();
  s+=`<polyline points="${bPts}" fill="none" stroke="rgba(120,185,255,0.14)" stroke-width="8"/>`;
  s+=`<polyline points="${bPts}" fill="none" stroke="rgba(155,210,255,0.72)" stroke-width="1.6" stroke-dasharray="8,4" filter="url(#glow)"/>`;
  s+=`<polyline points="${bPts}" fill="none" stroke="rgba(205,235,255,0.38)" stroke-width="0.8" stroke-dasharray="8,4"/>`;

  // Symbols
  for(let gi=0;gi<24;gi++){
    const zi=Math.floor(gi/4);
    const scx=BX+(gi+0.5)*SLOT_PITCH;
    const col=ZCL[zi];
    slots[gi].forEach((d,idx)=>{
      const label=d.symbol.slice(0,3);
      const sy=BY-(idx+0.5)*SH-2;
      const tip=`${d.symbol} — ${d.name}  |  90-IR: ${irFmt(d.ir_90)}  |  Zone ${irToZone(d.ir_90)}`;
      s+=`<text x="${scx}" y="${sy}" text-anchor="middle" font-family="'Courier New',monospace"
          font-size="${SFS}" font-weight="bold" fill="${col}" filter="url(#softglow)"
          cursor="pointer" data-tip="${tip.replace(/"/g,"&quot;")}">${label}</text>`;
    });
  }

  // OOB symbols
  oobWeak.forEach((sym,i)=>{
    s+=`<text x="${OW/2}" y="${BY-(i+0.5)*SH-2}" text-anchor="middle"
        font-family="'Courier New',monospace" font-size="8" fill="${ZCL[0]}" opacity="0.9">${sym.slice(0,3)}</text>`;
  });
  oobStr.forEach((sym,i)=>{
    s+=`<text x="${BX+BW+OW/2}" y="${BY-(i+0.5)*SH-2}" text-anchor="middle"
        font-family="'Courier New',monospace" font-size="8" fill="${ZCL[5]}" opacity="0.9">${sym.slice(0,3)}</text>`;
  });

  // OOB labels
  s+=`<text x="${OW/2}" y="10" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="${ZCL[0]}" opacity="0.8">OOB</text>`;
  s+=`<text x="${OW/2}" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="${ZCL[0]}" opacity="0.8">Weak</text>`;
  s+=`<text x="${OW/2}" y="30" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="${ZCL[0]}" opacity="0.7">[${oobWeak.length}]</text>`;
  s+=`<text x="${OW/2}" y="40" text-anchor="middle" font-family="'Courier New',monospace" font-size="6.5" fill="${ZCL[0]}" opacity="0.6">≥+99</text>`;
  s+=`<text x="${BX+BW+OW/2}" y="10" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="${ZCL[5]}" opacity="0.8">OOB</text>`;
  s+=`<text x="${BX+BW+OW/2}" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="${ZCL[5]}" opacity="0.8">Str</text>`;
  s+=`<text x="${BX+BW+OW/2}" y="30" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="${ZCL[5]}" opacity="0.7">[${oobStr.length}]</text>`;
  s+=`<text x="${BX+BW+OW/2}" y="40" text-anchor="middle" font-family="'Courier New',monospace" font-size="6.5" fill="${ZCL[5]}" opacity="0.6">≤-99</text>`;

  // Zone labels + IR ranges
  for(let zi=0;zi<6;zi++){
    const cx=BX+zi*ZW+ZW/2;
    s+=`<text x="${cx}" y="${LY_RANGE}" text-anchor="middle" font-family="'Courier New',monospace"
        font-size="8.5" fill="rgba(255,255,255,0.48)">${ZR[zi]}</text>`;
    s+=`<text x="${cx}" y="${LY_ZONE}" text-anchor="middle" font-family="'Trebuchet MS',sans-serif"
        font-size="10.5" font-weight="bold" fill="${ZCL[zi]}">${ZN[zi]}</text>`;
  }

  // Direction legend
  s+=`<text x="${BX+10}" y="${H-5}" font-family="'Trebuchet MS',sans-serif" font-size="7.5" fill="rgba(0,212,160,0.40)">← Weak / Oversold</text>`;
  s+=`<text x="${BX+BW-10}" y="${H-5}" text-anchor="end" font-family="'Trebuchet MS',sans-serif" font-size="7.5" fill="rgba(232,53,53,0.40)">Overbought / Strong →</text>`;

  svg.innerHTML=s;

  // Tooltip
  const tip=document.getElementById('histo-tip');
  svg.addEventListener('mousemove',e=>{
    const el=e.target;
    if(el.dataset.tip){
      tip.style.display='block';
      tip.style.left=(e.clientX+14)+'px';
      tip.style.top=(e.clientY-10)+'px';
      tip.textContent=el.dataset.tip;
    }else{tip.style.display='none';}
  });
  svg.addEventListener('mouseleave',()=>{tip.style.display='none';});
}

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
buildAllToggles();
buildHistogram();
renderLH();
TOGGLE_GROUPS.forEach(grp=>{
  sortState[grp.id]={field:'ir',dir:1};
  periodState[grp.id]='90';
  renderToggle(grp.id);
});
</script>
</body>
</html>
